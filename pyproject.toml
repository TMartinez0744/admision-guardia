[project]
name = "admision-guardia"
version = "0.1.0"
description = "Agente de admision de guardia"
requires-python = ">=3.12"
dependencies = [
    "gepa==0.1.4",
    "kit-tp-admision",
    "sentence-transformers==6.2.0",
    "vllm==0.32.0 ; sys_platform == 'linux'",
]

[tool.uv.sources]
kit-tp-admision = { path = "../talksmith-ing/missions/TPFinal" }

[dependency-groups]
dev = [
    "modal==1.6.4",
]

# El kit se agrega con:
#   uv add <ruta>/talksmith-ing/missions/TPFinal
# No copiar admision/ adentro del repo: se reemplaza por otra copia al evaluar.
